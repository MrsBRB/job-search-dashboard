<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Executive Job Search CRM v7.1 — Brooke Benkert</title>
<style>
:root {
  --bg:#f4f6fb; --card:#fff; --text:#0f1923; --muted:#64748b; --border:#e2e8f0;
  --blue:#2563eb; --blue-lt:#eff6ff; --blue-dk:#1e40af;
  --green:#16a34a; --green-lt:#f0fdf4;
  --amber:#d97706; --amber-lt:#fffbeb;
  --red:#dc2626; --red-lt:#fef2f2;
  --purple:#7c3aed; --purple-lt:#f5f3ff;
  --orange:#ea580c; --orange-lt:#fff7ed;
  --shadow:0 4px 20px rgba(15,23,42,.07);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,ui-sans-serif,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
a{color:var(--blue);text-decoration:none;}
a:hover{text-decoration:underline;}

/* LAYOUT */
.wrap{max-width:1600px;margin:0 auto;padding:20px;}

/* HEADER */
.header{background:linear-gradient(135deg,#1e3a5f 0%,#1e40af 100%);color:#fff;padding:22px 28px;border-radius:var(--radius);margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.header-left h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px;}
.header-left .sub{font-size:12px;opacity:.75;margin-top:2px;}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

/* BUTTONS */
button,.btn{font-family:inherit;cursor:pointer;transition:all .15s;border:none;border-radius:10px;font-weight:600;font-size:13px;}
.btn-primary{background:var(--blue);color:#fff;padding:9px 16px;}
.btn-primary:hover{background:var(--blue-dk);}
.btn-white{background:rgba(255,255,255,.15);color:#fff;padding:9px 14px;border:1px solid rgba(255,255,255,.3);}
.btn-white:hover{background:rgba(255,255,255,.25);}
.btn-sm{background:#fff;color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:8px;font-size:12px;}
.btn-sm:hover{border-color:var(--blue);color:var(--blue);}
.btn-sm.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);padding:5px 10px;border-radius:7px;font-size:11px;}
.btn-danger:hover{background:var(--red);color:#fff;}

/* STAT CARDS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.stat-val{font-size:28px;font-weight:900;line-height:1;color:var(--blue);}
.stat-val.amber{color:var(--amber);}
.stat-val.green{color:var(--green);}
.stat-val.red{color:var(--red);}
.stat-val.purple{color:var(--purple);}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;}

/* SECTION PANELS */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow);}
.panel-title{font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.panel-title .badge{background:var(--red-lt);color:var(--red);border:1px solid #fecaca;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:700;}
.panel-title .badge-green{background:var(--green-lt);color:var(--green);border:1px solid #bbf7d0;}
.panel-title .badge-amber{background:var(--amber-lt);color:var(--amber);border:1px solid #fde68a;}
.panel-title .badge-blue{background:var(--blue-lt);color:var(--blue);border:1px solid #bfdbfe;}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.mini{border:1px solid var(--border);border-radius:10px;padding:12px;background:#fafbfc;cursor:pointer;transition:border-color .15s;}
.mini:hover{border-color:var(--blue);}
.mini-company{font-weight:700;font-size:13px;margin-bottom:2px;}
.mini-role{font-size:11px;color:var(--muted);margin-bottom:6px;}
.mini-meta{font-size:11px;color:var(--muted);}

/* DECISION WATCH */
.decision-watch{border-left:4px solid var(--purple);}

/* NAV TABS */
.nav-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.nav-sep{width:1px;height:20px;background:var(--border);margin:0 4px;}

/* TABLE */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;min-width:1100px;}
th{background:#f8fafc;padding:10px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1;}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#f8fafc;}
tr.row-interview td{border-left:4px solid var(--green);}
tr.row-decision td{border-left:4px solid var(--purple);}
tr.row-waiting td{border-left:4px solid var(--blue);}
tr.row-followup td{border-left:4px solid var(--orange);}
tr.row-applied td{border-left:4px solid #cbd5e1;}
tr.row-rejected td{border-left:4px solid var(--red);}
tr.row-watch td{border-left:4px solid var(--purple);background:var(--purple-lt)!important;}

/* BADGES */
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;border:1px solid var(--border);background:#f1f5f9;white-space:nowrap;}
.tier1{background:#dcfce7;border-color:#bbf7d0;color:#14532d;}
.tier2{background:#eef2ff;border-color:#c7d2fe;color:#3730a3;}
.tier3{background:#fff7ed;border-color:#fed7aa;color:#9a3412;}

.status-badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800;white-space:nowrap;}
.s-interview{background:#dcfce7;color:#14532d;border:1px solid #bbf7d0;}
.s-waiting{background:#dbeafe;color:#1e3a8a;border:1px solid #bfdbfe;}
.s-decision{background:#f5f3ff;color:#5b21b6;border:1px solid #ddd6fe;}
.s-watch{background:#f5f3ff;color:#5b21b6;border:1px solid #a78bfa;}
.s-followup{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;}
.s-applied{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;}
.s-rejected{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;}
.s-offer{background:#bbf7d0;color:#14532d;border:1px solid #86efac;}

.health-strong{background:#dcfce7;color:#14532d;border:1px solid #bbf7d0;}
.health-active{background:#fef9c3;color:#854d0e;border:1px solid #fde68a;}
.health-slow{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;}
.health-weak{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;}

.due-overdue{background:#fee2e2;color:#991b1b;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700;}
.due-today{background:#fef3c7;color:#92400e;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700;}
.due-soon{background:#fff7ed;color:#9a3412;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700;}

.granola-link{color:var(--purple);font-weight:700;}
.granola-link:hover{text-decoration:underline;}
.details-link{color:var(--blue);font-weight:700;cursor:pointer;}
.onepager-link{color:var(--purple);font-weight:700;cursor:pointer;}

/* CONTROLS */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
#search{border:1px solid var(--border);border-radius:10px;padding:8px 14px;background:#fff;font-family:inherit;font-size:13px;min-width:240px;flex:1;}
#search:focus{outline:none;border-color:var(--blue);}
select.filter{border:1px solid var(--border);border-radius:10px;padding:8px 12px;background:#fff;font-family:inherit;font-size:13px;}
select.filter:focus{outline:none;border-color:var(--blue);}

/* TASKS TAB */
.tasks-header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.task-filters{display:flex;gap:6px;flex-wrap:wrap;}
.task-list{display:flex;flex-direction:column;gap:6px;}
.task-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 14px;display:flex;align-items:flex-start;gap:12px;transition:border-color .15s;}
.task-item:hover{border-color:#94a3b8;}
.task-item.done{opacity:.5;}
.task-item.done .task-text{text-decoration:line-through;color:var(--muted);}
.task-check{width:18px;height:18px;border:2px solid var(--border);border-radius:5px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s;}
.task-check.checked{background:var(--green);border-color:var(--green);}
.task-check.checked::after{content:'✓';color:#fff;font-size:11px;font-weight:700;}
.task-body{flex:1;min-width:0;}
.task-text{font-size:13px;color:var(--text);line-height:1.4;margin-bottom:4px;}
.task-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.task-company{font-size:11px;font-weight:700;color:var(--blue);}
.task-cat{font-size:11px;background:#f1f5f9;color:var(--muted);padding:1px 7px;border-radius:10px;font-weight:600;}
.task-cat.interview{background:#eff6ff;color:var(--blue);}
.task-cat.research{background:#f5f3ff;color:var(--purple);}
.task-cat.followup{background:#fff7ed;color:var(--amber);}
.task-due{font-size:11px;font-weight:600;}
.task-pri-high{color:var(--red);}
.task-pri-medium{color:var(--amber);}
.task-pri-low{color:var(--muted);}
.task-section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px;}

/* DRAWER */
.drawer-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:50;}
.drawer{position:fixed;top:0;right:0;width:min(780px,95vw);height:100%;background:#fff;overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.15);padding:24px;}
.drawer h2{font-size:22px;font-weight:800;margin-bottom:4px;}
.drawer .close-btn{float:right;background:#f1f5f9;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;}
.drawer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0;}
.dcard{border:1px solid var(--border);border-radius:10px;padding:10px;background:#fafbfc;}
.dcard b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
pre{white-space:pre-wrap;font-family:inherit;line-height:1.45;font-size:13px;background:#fafbfc;border:1px solid var(--border);border-radius:10px;padding:12px;}
.drawer-section{margin-top:16px;}
.drawer-section h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;}

/* ONE-PAGER */
.sheet{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;page-break-after:always;}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--border);padding-bottom:12px;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
.sheet-meta{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px;}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sheet-box{border:1px solid var(--border);border-radius:10px;padding:11px;background:#fafbfc;}
.sheet-box h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px;}
.sheet-box p{font-size:12px;line-height:1.5;white-space:pre-wrap;}

/* PROGRESS BAR */
.prog-bar{height:4px;background:#e2e8f0;border-radius:2px;overflow:hidden;margin-top:4px;}
.prog-fill{height:100%;border-radius:2px;background:var(--green);}

/* RESPONSIVE */
@media(max-width:900px){
  .stats{grid-template-columns:repeat(3,1fr);}
  .mini-grid{grid-template-columns:1fr 1fr;}
  .drawer-grid,.sheet-meta{grid-template-columns:1fr 1fr;}
  .sheet-grid{grid-template-columns:1fr;}
}
@media(max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr);}
  .mini-grid{grid-template-columns:1fr;}
  .header{flex-direction:column;}
}
@media print{
  .header,.stats,.panel,.controls,.nav-wrap,.tbl-wrap,.drawer-bg,.btn-white,#tab-pipeline,#tab-tasks,#tab-contacts{display:none!important;}
  .sheet{box-shadow:none;border:1px solid #ddd;}
  body{background:#fff;}
}

/* HIDDEN */
.hidden{display:none!important;}

/* CONTACTS */
.contacts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
.contact-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.contact-card:hover{border-color:var(--blue);}
.contact-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue-dk));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0;}
.contact-header{display:flex;gap:12px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.contact-name{font-weight:700;}
.contact-role{font-size:12px;color:var(--muted);}
.contact-detail{font-size:12px;color:var(--muted);margin-top:4px;}

/* ERROR */
.error-box{background:#fee2e2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:10px;margin-bottom:12px;display:none;}
</style>
</head>
<body>
<div class="wrap">

<div class="header">
  <div class="header-left">
    <h1>Executive Job Search CRM <span style="opacity:.6;font-weight:400;font-size:16px;">v7.1</span></h1>
    <div class="sub">Brooke Benkert · Fleet &amp; Operations Executive · Director / VP · Remote-First</div>
    <div class="sub" style="margin-top:6px;opacity:.6;">16 applications · Task management · Home Depot confirmed · Jun 8 2026</div>
  </div>
  <div class="header-actions">
    <button class="btn-white" onclick="exportJSON()">↓ Export JSON</button>
    <button class="btn-white" onclick="document.getElementById('tab-btn-onepagers').click()">📋 One-Pagers</button>
    <button class="btn-white" onclick="window.print()">🖨 Print</button>
  </div>
</div>

<div id="error-box" class="error-box"></div>

<div class="stats" id="stats-row"></div>

<!-- PRIORITY PANELS -->
<div class="panel decision-watch" id="panel-watch" style="border-left:4px solid var(--purple);">
  <div class="panel-title">🔮 Decision Watch <span class="badge" style="background:var(--purple-lt);color:var(--purple);border-color:#ddd6fe;">Pending</span></div>
  <div class="mini-grid" id="mount-watch"></div>
</div>

<div class="panel">
  <div class="panel-title">📅 Upcoming Interviews &amp; Calls</div>
  <div class="mini-grid" id="mount-interviews"></div>
</div>

<div class="panel">
  <div class="panel-title">⏳ Waiting on Company</div>
  <div class="mini-grid" id="mount-waiting"></div>
</div>

<div class="panel" id="panel-actions">
  <div class="panel-title">⚡ Action Items This Week</div>
  <div class="mini-grid" id="mount-actions"></div>
</div>

<!-- TABS -->
<div class="nav-wrap">
  <button class="btn-sm active" id="tab-btn-pipeline" onclick="switchTab('pipeline',this)">Pipeline</button>
  <button class="btn-sm" id="tab-btn-status" onclick="switchTab('status',this)">Status</button>
  <button class="btn-sm" id="tab-btn-salary" onclick="switchTab('salary',this)">Salary</button>
  <button class="btn-sm" id="tab-btn-tasks" onclick="switchTab('tasks',this)">Tasks <span id="task-count-badge" style="background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:2px;"></span></button>
  <div class="nav-sep"></div>
  <button class="btn-sm" id="tab-btn-onepagers" onclick="switchTab('onepagers',this)">One-Pagers</button>
</div>

<!-- PIPELINE TAB -->
<div id="tab-pipeline">
  <div class="controls">
    <input id="search" type="text" placeholder="Search company, role, contact, notes…" oninput="renderTable()">
    <select class="filter" id="filter-tier" onchange="renderTable()">
      <option value="">All tiers</option><option>Tier 1</option><option>Tier 2</option><option>Tier 3</option>
    </select>
    <select class="filter" id="filter-stage" onchange="renderTable()">
      <option value="">All stages</option>
    </select>
    <select class="filter" id="filter-sort" onchange="renderTable()">
      <option value="health">Sort: Health ↓</option>
      <option value="prob">Sort: Probability ↓</option>
      <option value="followup">Sort: Follow-Up</option>
      <option value="company">Sort: Company A–Z</option>
    </select>
  </div>
  <div class="tbl-wrap" id="tbl-container"></div>
</div>

<!-- STATUS TAB -->
<div id="tab-status" class="hidden">
  <div class="tbl-wrap" id="tbl-status"></div>
</div>

<!-- SALARY TAB -->
<div id="tab-salary" class="hidden">
  <div class="tbl-wrap" id="tbl-salary"></div>
</div>

<!-- TASKS TAB -->
<div id="tab-tasks" class="hidden">
  <div class="tasks-header">
    <div style="font-weight:700;font-size:16px;">Task Manager</div>
    <div class="task-filters">
      <button class="btn-sm active" onclick="filterTasks('all',this)">All Open</button>
      <button class="btn-sm" onclick="filterTasks('today',this)">Due Today</button>
      <button class="btn-sm" onclick="filterTasks('week',this)">This Week</button>
      <button class="btn-sm" onclick="filterTasks('Interview Prep',this)">Interview Prep</button>
      <button class="btn-sm" onclick="filterTasks('Follow-Up',this)">Follow-Up</button>
      <button class="btn-sm" onclick="filterTasks('Research',this)">Research</button>
      <button class="btn-sm" onclick="filterTasks('done',this)">✓ Completed</button>
    </div>
  </div>
  <div class="task-list" id="task-list"></div>
</div>

<!-- ONE-PAGERS TAB -->
<div id="tab-onepagers" class="hidden" id="cheatSheets"></div>

</div><!-- wrap -->

<!-- DRAWER -->
<div class="drawer-bg" id="drawer-bg" onclick="closeDrawer()">
  <div class="drawer" onclick="event.stopPropagation()">
    <button class="close-btn" onclick="closeDrawer()">✕ Close</button>
    <div id="drawer-content"></div>
  </div>
</div>

<script>
// ============================================================

let jobs = JSON.parse(atob(INITIAL_B64));
const TODAY = new Date().toISOString().slice(0,10);

// ============================================================
// HELPERS
// ============================================================
function esc(v){ return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(v){
  if(!v) return '—';
  const d = new Date(String(v).slice(0,10)+'T12:00:00');
  return isNaN(d)?esc(v):d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function daysUntil(v){
  if(!v) return null;
  const a=new Date(TODAY+'T12:00:00'), b=new Date(String(v).slice(0,10)+'T12:00:00');
  return isNaN(b)?null:Math.round((b-a)/86400000);
}
function dueBadge(v){
  const d=daysUntil(v);
  if(d===null) return '';
  if(d<0) return `<span class="due-overdue">Overdue</span>`;
  if(d===0) return `<span class="due-today">Today</span>`;
  if(d<=3) return `<span class="due-soon">${d}d</span>`;
  return `<span style="font-size:11px;color:var(--muted)">${fmt(v)}</span>`;
}
function sal(o){
  if(o.salaryMin && o.salaryMax) return '$'+(+o.salaryMin/1000).toFixed(0)+'K–$'+(+o.salaryMax/1000).toFixed(0)+'K';
  if(o.compensation && !['TBD','TBA','Not posted',''].includes(o.compensation)) return esc(o.compensation);
  return 'TBD';
}
function healthScore(o){ return Number(o.healthScore||o.executiveFit||0); }
function healthBadge(o){
  const s=healthScore(o);
  const cls=s>=80?'health-strong':s>=65?'health-active':s>=45?'health-slow':'health-weak';
  const lbl=s>=80?'Strong':s>=65?'Active':s>=45?'Slow':'Weak';
  return `<span class="pill ${cls}">${lbl} ${s}</span>`;
}
function statusKind(o){
  const s=(String(o.status||'')+' '+String(o.stage||'')).toLowerCase();
  if(o.decisionWatch) return 'watch';
  if(s.includes('offer')) return 'offer';
  if(s.includes('reject')||s.includes('declined')) return 'rejected';
  if(s.includes('final decision')||s.includes('decision pending')) return 'decision';
  if(s.includes('waiting on company')||o.waitingOnCompany) return 'waiting';
  if(/interview|screen|recruiter call|hiring manager|panel|post recruiter|post hiring/.test(s)) return 'interview';
  if(s.includes('follow')) return 'followup';
  return 'applied';
}
function statusBadge(o){
  const k=statusKind(o);
  const labels={watch:'🔮 Decision Watch',offer:'🎉 Offer',rejected:'✕ Rejected',decision:'⚡ Final Decision',waiting:'⏳ Waiting',interview:'🟢 Interview/Active',followup:'⚠ Follow-Up',applied:'Applied'};
  return `<span class="status-badge s-${k}">${labels[k]||'Applied'}</span>`;
}
function rowClass(o){ return 'row-'+statusKind(o); }
function taskCatClass(c){ return c==='Interview Prep'?'interview':c==='Research'?'research':c==='Follow-Up'?'followup':''; }
function short(v,n=120){ v=String(v||''); return v.length>n?v.slice(0,n-1)+'…':v; }
function firstLines(v,n=6){ return String(v||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,n).join('\n'); }
function openTaskCount(){ return jobs.reduce((s,j)=>s+(j.tasks||[]).filter(t=>!t.done).length,0); }

// ============================================================
// STATS
// ============================================================
function renderStats(){
  const active=jobs.filter(j=>j.stage!=='Closed');
  const interviewing=jobs.filter(j=>['Recruiter Screen','Recruiter Call','Hiring Manager','Panel','Final Decision','Post Recruiter Screen','Post Hiring Manager Interview'].includes(j.stage));
  const watch=jobs.filter(j=>j.decisionWatch);
  const dueSoon=jobs.filter(j=>{ const d=daysUntil(j.followUpDate); return !j.waitingOnCompany&&d!==null&&d<=2; });
  const avgProb=active.length?Math.round(active.reduce((s,j)=>s+Number(j.probability||0),0)/active.length):0;
  const openTasks=openTaskCount();
  const fmc=jobs.filter(j=>String(j.fmcIndustryMatch||'').toLowerCase()==='yes').length;
  document.getElementById('stats-row').innerHTML=`
    <div class="stat"><div class="stat-val">${jobs.length}</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-val">${active.length}</div><div class="stat-lbl">Active</div></div>
    <div class="stat"><div class="stat-val green">${interviewing.length}</div><div class="stat-lbl">Interviewing</div></div>
    <div class="stat"><div class="stat-val purple">${watch.length}</div><div class="stat-lbl">Decision Watch</div></div>
    <div class="stat"><div class="stat-val amber">${dueSoon.length}</div><div class="stat-lbl">Follow-Up Due</div></div>
    <div class="stat"><div class="stat-val red">${openTasks}</div><div class="stat-lbl">Open Tasks</div></div>
    <div class="stat"><div class="stat-val">${avgProb}%</div><div class="stat-lbl">Avg Probability</div></div>
    <div class="stat"><div class="stat-val">${fmc}</div><div class="stat-lbl">FMC Match</div></div>
  `;
  const badge=document.getElementById('task-count-badge');
  if(badge) badge.textContent=openTasks>0?openTasks:'';
}

// ============================================================
// MINI PANELS
// ============================================================
function miniCard(o, extra=''){
  return `<div class="mini" onclick="openDetail('${o.id}')">
    <div class="mini-company">${esc(o.company)}</div>
    <div class="mini-role">${esc(o.role)}</div>
    ${statusBadge(o)}
    ${extra}
  </div>`;
}

function renderPanels(){
  // Decision Watch
  const watch=jobs.filter(j=>j.decisionWatch);
  const wm=document.getElementById('mount-watch');
  const pw=document.getElementById('panel-watch');
  if(watch.length){
    pw.classList.remove('hidden');
    wm.innerHTML=watch.map(o=>miniCard(o,`<div class="mini-meta" style="margin-top:6px;color:var(--purple);font-size:11px;">${esc(short(o.decisionWatchReason||'',100))}</div><div class="mini-meta">Expected: ${fmt(o.expectedUpdateDate)}</div>`)).join('');
  } else { pw.classList.add('hidden'); }

  // Upcoming interviews
  const upcoming=jobs.filter(o=>o.interviewDate&&o.interviewDate>=TODAY&&!o.interviewCompleted).sort((a,b)=>a.interviewDate.localeCompare(b.interviewDate));
  const im=document.getElementById('mount-interviews');
  im.innerHTML=upcoming.length?upcoming.slice(0,6).map(o=>miniCard(o,`<div class="mini-meta" style="margin-top:6px;">${fmt(o.interviewDate)} ${esc(o.interviewTime||'')} · ${esc(o.interviewType||o.stage||'')}</div><div class="mini-meta">👤 ${esc(o.contact||'TBD')}</div>`)).join(''):
    '<div class="mini-meta" style="padding:8px;color:var(--muted);">No upcoming scheduled interviews.</div>';

  // Waiting
  const waiting=jobs.filter(o=>o.waitingOnCompany&&!o.decisionWatch).sort((a,b)=>(a.expectedUpdateDate||'9999').localeCompare(b.expectedUpdateDate||'9999'));
  const wam=document.getElementById('mount-waiting');
  wam.innerHTML=waiting.length?waiting.map(o=>miniCard(o,`<div class="mini-meta" style="margin-top:6px;">Expected: ${fmt(o.expectedUpdateDate||o.followUpDate)}</div>${o.applicationStatusUrl?`<div style="margin-top:4px;"><a href="${esc(o.applicationStatusUrl)}" target="_blank" onclick="event.stopPropagation()">Portal →</a></div>`:''}`)).join(''):
    '<div class="mini-meta" style="padding:8px;color:var(--muted);">None currently.</div>';

  // Actions this week
  const actions=jobs.filter(o=>{ const d=daysUntil(o.followUpDate); return !o.waitingOnCompany&&!o.decisionWatch&&d!==null&&d<=4; }).sort((a,b)=>(daysUntil(a.followUpDate)||0)-(daysUntil(b.followUpDate)||0)).slice(0,6);
  const am=document.getElementById('mount-actions');
  am.innerHTML=actions.length?actions.map(o=>miniCard(o,`<div class="mini-meta" style="margin-top:6px;">${esc(short(o.actionNeeded||o.nextStep||'',90))}</div><div class="mini-meta">Follow-up: ${fmt(o.followUpDate)} ${dueBadge(o.followUpDate)}</div>`)).join(''):
    '<div class="mini-meta" style="padding:8px;color:var(--muted);">No urgent actions.</div>';
}

function filteredJobs(){
  const q=(document.getElementById('search')||{value:''}).value.toLowerCase();
  const tf=(document.getElementById('filter-tier')||{value:''}).value;
  const sf=(document.getElementById('filter-stage')||{value:''}).value;
  const sort=(document.getElementById('filter-sort')||{value:'health'}).value;
  let list=jobs.filter(o=>{
    if(tf&&o.tier!==tf) return false;
    if(sf&&o.stage!==sf) return false;
    if(q&&!JSON.stringify(o).toLowerCase().includes(q)) return false;
    return true;
  });
  if(sort==='health') list.sort((a,b)=>healthScore(b)-healthScore(a));
  else if(sort==='prob') list.sort((a,b)=>Number(b.probability||0)-Number(a.probability||0));
  else if(sort==='followup') list.sort((a,b)=>(a.followUpDate||'9999').localeCompare(b.followUpDate||'9999'));
  else if(sort==='company') list.sort((a,b)=>a.company.localeCompare(b.company));
  return list;
}

// ============================================================
// TASKS
// ============================================================
let taskFilter='all';

function renderTasks(){
  const today=TODAY;
  const weekEnd=new Date(today); weekEnd.setDate(weekEnd.getDate()+7);
  const weekStr=weekEnd.toISOString().slice(0,10);

  // Collect all tasks with company info
  let allTasks=[];
  jobs.forEach(j=>{
    (j.tasks||[]).forEach(t=>{
      allTasks.push({...t, _company:j.company, _jobId:j.id, _stage:j.stage});
    });
  });

  // Apply filter
  let filtered=allTasks;
  if(taskFilter==='all') filtered=allTasks.filter(t=>!t.done);
  else if(taskFilter==='done') filtered=allTasks.filter(t=>t.done);
  else if(taskFilter==='today') filtered=allTasks.filter(t=>!t.done&&t.due&&t.due<=today);
  else if(taskFilter==='week') filtered=allTasks.filter(t=>!t.done&&t.due&&t.due<=weekStr);
  else filtered=allTasks.filter(t=>!t.done&&t.category===taskFilter);

  // Sort: overdue first, then by due date, then by priority
  const priOrder={High:0,Medium:1,Low:2,'':3};
  filtered.sort((a,b)=>{
    const da=a.due||'9999', db=b.due||'9999';
    if(da!==db) return da.localeCompare(db);
    return (priOrder[a.priority]??3)-(priOrder[b.priority]??3);
  });

  // Group by company
  const byCompany={};
  filtered.forEach(t=>{ if(!byCompany[t._company]) byCompany[t._company]=[]; byCompany[t._company].push(t); });

  const openCount=allTasks.filter(t=>!t.done).length;
  const doneCount=allTasks.filter(t=>t.done).length;

  const container=document.getElementById('task-list');
  if(!filtered.length){
    container.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted);">No tasks match this filter. 🎉</div>';
    return;
  }

  let html='';
  // If showing by company (not done filter), group them
  if(taskFilter!=='done'){
    Object.entries(byCompany).forEach(([company, tasks])=>{
      const job=jobs.find(j=>j.company===company);
      const doneHere=tasks.filter(t=>t.done).length;
      html+=`<div class="task-section-label">${esc(company)} — ${esc(job?.stage||'')} 
        <span style="font-weight:400;color:var(--muted)">(${tasks.length-doneHere} open)</span>
        <span class="details-link" style="font-size:11px;margin-left:8px;text-transform:none;font-weight:600" onclick="openDetail('${job?.id||''}')">Details →</span>
      </div>`;
      tasks.forEach(t=>{ html+=taskItemHTML(t); });
    });
  } else {
    filtered.forEach(t=>{ html+=taskItemHTML(t); });
  }

  container.innerHTML=`
    <div style="display:flex;gap:16px;margin-bottom:12px;font-size:13px;color:var(--muted);">
      <span>📋 <b style="color:var(--text)">${openCount}</b> open tasks</span>
      <span>✅ <b style="color:var(--text)">${doneCount}</b> completed</span>
      <span>Showing <b style="color:var(--text)">${filtered.length}</b></span>
    </div>
    ${html}`;
}

function taskItemHTML(t){
  const d=daysUntil(t.due);
  const dueCls=d===null?'':d<0?'task-pri-high':d===0?'task-pri-high':d<=2?'task-pri-medium':'';
  const dueLabel=d===null?'':d<0?`Overdue ${Math.abs(d)}d`:d===0?'Due today':d===1?'Tomorrow':`${fmt(t.due)}`;
  const priCls=t.priority==='High'?'task-pri-high':t.priority==='Medium'?'task-pri-medium':'task-pri-low';
  const catCls=taskCatClass(t.category);
  return `<div class="task-item${t.done?' done':''}" id="task-${esc(t.id)}">
    <div class="task-check${t.done?' checked':''}" onclick="toggleTask('${esc(t._jobId)}','${esc(t.id)}')"></div>
    <div class="task-body">
      <div class="task-text">${esc(t.task)}</div>
      <div class="task-meta">
        <span class="task-company">${esc(t._company)}</span>
        ${t.category?`<span class="task-cat ${catCls}">${esc(t.category)}</span>`:''}
        ${t.priority?`<span class="${priCls}" style="font-size:11px;font-weight:600">${esc(t.priority)}</span>`:''}
        ${dueLabel?`<span class="task-due ${dueCls}">${dueLabel}</span>`:''}
      </div>
    </div>
  </div>`;
}

function toggleTask(jobId, taskId){
  const job=jobs.find(j=>j.id===jobId);
  if(!job) return;
  const task=(job.tasks||[]).find(t=>t.id===taskId);
  if(!task) return;
  task.done=!task.done;
  job.taskDone=(job.tasks||[]).filter(t=>t.done).length;
  renderTasks();
  renderStats();
}

function filterTasks(f, btn){
  taskFilter=f;
  document.querySelectorAll('.task-filters .btn-sm').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderTasks();
}

// ============================================================
// TAB SWITCHING
// ============================================================
let currentTab='pipeline';
function switchTab(name, btn){
  ['pipeline','status','salary','tasks','onepagers'].forEach(t=>{
    document.getElementById('tab-'+t)?.classList.add('hidden');
    document.getElementById('tab-btn-'+t)?.classList.remove('active');
  });
  const el=document.getElementById('tab-'+name);
  if(el) el.classList.remove('hidden');
  const btnEl=btn||document.getElementById('tab-btn-'+name);
  if(btnEl) btnEl.classList.add('active');
  currentTab=name;
  if(name==='status') renderStatusTable();
  else if(name==='salary') renderSalaryTable();
  else if(name==='tasks') renderTasks();
  else if(name==='onepagers') renderOnePagers();
}
function switchTabById(tabId){
  const name=tabId.replace('tab-','');
  switchTab(name);
}

// STAGE FILTER POPULATE
// ============================================================
function populateStages(){
  const sel=document.getElementById('filter-stage');
  if(!sel) return;
  const stages=[...new Set(jobs.map(o=>o.stage).filter(Boolean))].sort();
  sel.innerHTML='<option value="">All stages</option>'+stages.map(s=>`<option>${esc(s)}</option>`).join('');
}

// ============================================================
// EXPORT
// ============================================================
function exportJSON(){
  const blob=new Blob([JSON.stringify(jobs,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`jobs_v7_1_${TODAY}.json`; a.click();
  URL.revokeObjectURL(url);
}

// INIT
// ============================================================

  try{
    populateStages();
    renderStats();
    renderPanels();
    renderTable();
    document.getElementById('tab-status').classList.add('hidden');
    document.getElementById('tab-salary').classList.add('hidden');

  } catch(e){
    const box=document.getElementById('error-box');
    box.style.display='block';
    box.textContent='Init error: '+e.message;

}
